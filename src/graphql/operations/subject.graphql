mutation createSubject($input: CreateSubjectInput!) {
  createSubject(input: $input) {
    name
    id
    creator {
      firstName
      lastName
    }
    createdAt
  }
}

query GetSubjects($after: Cursor, $first: Int, $before: Cursor, $last: Int) {
  subjects(after: $after, first: $first, before: $before, last: $last) {
    edges {
      cursor

      node {
        creator {
          lastName
          firstName
        }
        createdAt
        id
        name
      }
    }
  }
}
subscription onSubjectCreated {
  subjectCreated {
    name
    createdAt
    creator {
      id
      lastName
      lastName
    }
  }
}

subscription onSubjectUpdated {
  subjectUpdated {
    name
    createdAt
    creator {
      id
      lastName
      lastName
    }
  }
}
