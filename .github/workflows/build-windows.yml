name: Build Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify Electron files
        shell: pwsh
        run: |
          Get-ChildItem dist-electron
          if (!(Test-Path "dist-electron/main.js")) { exit 1 }
          if (!(Test-Path "dist-electron/preload.cjs")) { exit 1 }

      - name: Package Windows app
        run: npx electron-builder --win --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
